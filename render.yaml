services:
  - type: web
    name: room-booking
    runtime: python
    repo: https://github.com/ejaz-uddin-swaron/room-booking
    branch: main
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn bookings.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.7"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: EMAIL
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: FERNET_SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_DOCUMENTS_BUCKET
        value: documents
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NeoScape_Api_Key
        sync: false
      - key: FRONTEND_URL
        value: "https://neoscapeproperties.co.uk"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  - type: cron
    name: room-booking-reminders
    runtime: python
    repo: https://github.com/ejaz-uddin-swaron/room-booking
    branch: main
    schedule: "0 8 * * *" # Runs every day at 08:00 AM UTC
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: python manage.py send_rent_reminders
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.7"
      - fromService:
          type: web
          name: room-booking
